# Default values for opsera-jobengine-core.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-jobengine-core
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "a50ff906364a54ddc3e1f6428a0221ff8cb5e599"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: [/]
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 300
  targetMemoryUtilizationPercentage: 120

nodeSelector:
  Name: tools-node

tolerations: []

affinity: {}
REDIS_HOST: opsera-redis:6379
REDIS_PASSWORD: opsera
REDIS_DB: 0
REST_PORT: 80

serviceCategory: Platform_Services

pdb:
  minAvailable: 1

jobEngineNamespace: opsera-job-engine
jobEngineEfsVolumeClaim: opsera-shared-workspace
k8sIntegratorVolumeName: efs-aws-efs-volume-k8s-integrator
CLOUD_PROVIDER: AWS

resourceProfiles:
  micro:
    cpuRequest: "0.5"
    cpuLimit: "0.5"
    memRequest: "300Mi"
    memLimit: "300Mi"
  small:
    cpuRequest: "250m"
    cpuLimit: "250m"
    memRequest: "1G"
    memLimit: "1G"
  medium:
    cpuRequest: "500m"
    cpuLimit: "500m"
    memRequest: "2G"
    memLimit: "2G"
  large:
    cpuRequest: "1"
    cpuLimit: "1"
    memRequest: "3.5G"
    memLimit: "3.5G"
  xlarge:
    cpuRequest: "2"
    cpuLimit: "2"
    memRequest: "7G"
    memLimit: "7G"
  twoxlarge:
    cpuRequest: "3.5"
    cpuLimit: "3.5"
    memRequest: "14G"
    memLimit: "14G"
