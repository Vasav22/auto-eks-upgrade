{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "anchore-engine.fullname" . }}
  labels:
    app: {{ template "anchore-engine.fullname" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- with .Values.ingress.labels }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.anchoreGlobal.labels }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
  {{- if .Values.ingress.apiHosts }}
    {{- range .Values.ingress.apiHosts }}
    - host: {{ . | quote }}
      http:
        paths:
        - path: {{ $.Values.ingress.apiPath }}
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ template "anchore-engine.api.fullname" $ }}
              port:
                number: {{ $.Values.anchoreApi.service.port }}
    {{- end }}
    {{- if and (and .Values.anchoreEnterpriseGlobal.enabled .Values.anchoreEnterpriseUi.enabled) .Values.ingress.uiHosts }}
    {{- range .Values.ingress.uiHosts }}
    - host: {{ . | quote }}
      http:
        paths:
        - path: {{ $.Values.ingress.uiPath }}
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ template "anchore-engine.enterprise-ui.fullname" $ }}
              port: {{ $.Values.anchoreEnterpriseUi.service.port }}
    {{- end }}
    {{- end }}
  {{- else }}
    - http:
        paths:
        - path: {{ $.Values.ingress.apiPath }}
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ template "anchore-engine.api.fullname" $ }}
              port: {{ $.Values.anchoreApi.service.port }}
        {{- if and .Values.anchoreEnterpriseGlobal.enabled .Values.anchoreEnterpriseUi.enabled }}
        - path: {{ $.Values.ingress.uiPath }}
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ template "anchore-engine.enterprise-ui.fullname" $ }}
              port: {{ $.Values.anchoreEnterpriseUi.service.port }}

        {{- end }}
  {{- end }}
{{- end -}}
