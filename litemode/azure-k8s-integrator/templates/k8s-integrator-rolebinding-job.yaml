kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "k8s-integrator-volume.fullname" . }}-job
  labels:
    {{- include "k8s-integrator-volume.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: {{ include "k8s-integrator-volume.fullname" . }}
  namespace: {{ .Values.opsera_system_namespace }}
