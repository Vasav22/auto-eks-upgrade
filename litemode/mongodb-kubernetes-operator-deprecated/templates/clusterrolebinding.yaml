apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.operator.name }}-wait-job
subjects:
- kind: ServiceAccount
  name: {{ .Values.operator.name }}-wait-job
  namespace: {{ .Release.Namespace}}
roleRef:
  kind: ClusterRole
  name: {{ .Values.operator.name }}-wait-job
  apiGroup: rbac.authorization.k8s.io
