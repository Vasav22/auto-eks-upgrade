apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mongodb-instance.fullname" . }}-wait-job
subjects:
- kind: ServiceAccount
  name: {{ include "mongodb-instance.fullname" . }}-wait-job
  namespace: {{ .Release.Namespace}}
roleRef:
  kind: ClusterRole
  name: {{ include "mongodb-instance.fullname" . }}-wait-job
  apiGroup: rbac.authorization.k8s.io
