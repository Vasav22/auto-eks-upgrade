apiVersion: batch/v1
kind: Job
metadata:
  labels:
    job-name:  {{ include "vault-tenant.fullname" . }}
  name: {{ include "vault-tenant.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 4
  suspend: false
  template:
    metadata:
      labels:
        job-name: {{ include "vault-tenant.fullname" . }}
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - |
          set -e

          sleep 30

          ### Get admin token
          read VAULT_URI_ENCODED VAULT_TOKEN_ENCODED < <(curl --location --request POST {{ .Values.microservice_url_read }} \
              --header 'accept: application/json' \
              --header 'Content-Type: application/json' \
              --data-raw '{
                  "customerId": "{{ .Values.liteClusterId }}",
                  "componentKeys": [
                      "VAULT_TOKEN",
                      "VAULT_KEY",
                      "VAULT_URI",
                      "KUBE_TOKEN",
                      "VAULT_ROLE"
                  ]
              }' -k | jq -r '"\(.data.VAULT_URI) \(.data.VAULT_TOKEN)"')


          export VAULT_URI=$(echo $VAULT_URI_ENCODED | base64 -d)
          export VAULT_TOKEN=$(echo $VAULT_TOKEN_ENCODED | base64 -d)

          ### Login to vault with admin token
          export VAULT_ADDR=$VAULT_URI
          vault login -no-print $VAULT_TOKEN
         
          set +e

          ### Enable tenant's path 
          vault secrets enable -path={{ .Values.liteClusterId }}{{ .Values.customerId }} kv
         
          ### Create policy for tenant token 
          vault policy write {{ .Values.liteClusterId }}{{ .Values.customerId }}-policy - <<EOF
          path "litedev1tenant1/*" {
            capabilities = ["create", "read", "update", "delete", "list"]
          }
          EOF

          set -e
         
          ### Create tenant token with the tenant policy 
          tenant_token=$(vault token create -policy="{{ .Values.liteClusterId }}{{ .Values.customerId }}-policy" -orphan -format=json | jq -r '.auth.client_token')

          ### Login as tenant tokena and write sample secret
          vault login -no-print $tenant_token
          vault kv put {{ .Values.liteClusterId }}{{ .Values.customerId }}/data1 value="secretA"

          ### Push tenant token to Platform Vault
          vault_uri=$(printf "{{ .Values.VAULT_URI }}" | base64 | tr -d '\n')
          vault_role=$(printf "dev" | base64)
          vault_tenant_token=$(echo -n $tenant_token | base64 -w 0)
         
          curl --location --request POST {{ .Values.microservice_url }} \
                  --header 'accept: application/json' \
                  --header 'Content-Type: application/json' \
                  --data-raw '{
                      "customerId": "{{ .Values.liteClusterId }}{{ .Values.customerId }}",
                      "data": {
                        "VAULT_TOKEN": "'$vault_tenant_token'",
                        "VAULT_KEY": "b3BzZXJh",
                        "VAULT_URI": "'$vault_uri'",
                        "VAULT_ROLE": "'$vault_role'"
                      }
                  }' -k


        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        name: create-tenant-vault
      restartPolicy: Never
