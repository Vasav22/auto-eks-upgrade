mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          endpoint: s3.us-east-2.amazonaws.com
          region: us-east-2
          #secret_access_key: "${AWS_SECRET_ACCESS_KEY}" # This is a secret injected via an environment variable
          #access_key_id: "${AWS_ACCESS_KEY_ID}" # This is a secret injected via an environment variable
          secret_access_key: "REPLACE_SECRET_ACCESS_KEY"
          access_key_id: "REPLACE_ACCESS_KEY_ID"

    blocks_storage:
      s3:
        bucket_name: opsera-grafana-mimir-blocks
    alertmanager_storage:
      s3:
        bucket_name: opsera-grafana-mimir-alertmanager
    ruler_storage:
      s3:
        bucket_name: opsera-grafana-mimir-ruler
