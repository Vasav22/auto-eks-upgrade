# Default values for opsera-jobengine-broker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-pipeline/opsera-infra-service
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v4"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  name: opsera-infra-service
  type: ClusterIP
  port: 8501
  targetPort: 8501
  selector:
    app.kubernetes.io/name: opsera-infra-service
    app.kubernetes.io/instance: opsera-infra-service

ingress:
  enabled: true
  namespace: microservices
  name: opsera-infra-service
  ingressClassName: nginx
  host: opsera-infra-service.opsera-<env>-private.opsera.io
  serviceName: opsera-infra-service
  servicePort: 8501
  paths:
    - /

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi


nodeSelector:
  Name: microservice-node

tolerations: []

affinity: {}

extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_DB_HOST
    secretKey: OPSERA_DB_HOST
  - secretName: microservices-ms-env
    envName: OPSERA_DB_NAME
    secretKey: OPSERA_DB_NAME
  - secretName: microservices-ms-env
    envName: OPSERA_DB_USER
    secretKey: OPSERA_DB_USER
  - secretName: microservices-ms-env
    envName: OPSERA_DB_PASSWORD
    secretKey: OPSERA_DB_PASSWORD
  - secretName: microservices-ms-env
    envName: OPSERA_INFRA_SERVICE_AWS_ACCESS_KEY_ID
    secretKey: OPSERA_INFRA_SERVICE_AWS_ACCESS_KEY_ID
  - secretName: microservices-ms-env
    envName: OPSERA_INFRA_SERVICE_AWS_SECRET_ACCESS_KEY
    secretKey: OPSERA_INFRA_SERVICE_AWS_SECRET_ACCESS_KEY
  - secretName: microservices-ms-env
    envName: ASSUME_ROLE_ARN_CUSTOMER
    secretKey: ASSUME_ROLE_ARN_CUSTOMER

serviceCategory: Platform_Services

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 300
  targetMemoryUtilizationPercentage: 120
