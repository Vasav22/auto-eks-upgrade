{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "eks-upgrade.fullname" . }}-migrations-{{ .Release.Revision }}
  namespace: {{ include "eks-upgrade.namespace" . }}
  labels:
    {{- include "eks-upgrade.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "eks-upgrade.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      serviceAccountName: {{ .Values.api.name }}
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z $(echo $DATABASE_URL | sed 's|.*@||' | cut -d/ -f1 | cut -d: -f1) 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3;
              done
          envFrom:
            {{- if or .Values.api.env.DATABASE_URL .Values.api.env.JWT_SECRET }}
            - secretRef:
                name: {{ .Values.api.name }}-secrets
            {{- end }}
            {{- with .Values.api.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      containers:
        - name: migrations
          image: {{ include "eks-upgrade.image" (dict "global" .Values.global "repository" .Values.migrations.image.repository "tag" .Values.migrations.image.tag) }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          command: ["npx", "typeorm", "migration:run", "-d", "dist/database/data-source.js"]
          envFrom:
            - configMapRef:
                name: {{ .Values.api.name }}-config
            {{- if or .Values.api.env.DATABASE_URL .Values.api.env.JWT_SECRET }}
            - secretRef:
                name: {{ .Values.api.name }}-secrets
            {{- end }}
            {{- with .Values.api.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
