# ─────────────────────────────────────────────────────────────────────────────
# values-opsera-test.yaml
# Override file for deployment to opsera-test-cluster
#
# Usage:
#   helm upgrade --install eks-upgrade ./charts/eks-upgrade \
#     -f charts/eks-upgrade/values.yaml \
#     -f charts/eks-upgrade/values-opsera-test.yaml \
#     --set api.env.DATABASE_URL="postgres://..." \
#     --set api.env.JWT_SECRET="..." \
#     --namespace eks-upgrade \
#     --create-namespace
# ─────────────────────────────────────────────────────────────────────────────

global:
  namespace: eks-upgrade
  environment: test
  clusterName: opsera-test-cluster
  imageRegistry: ""      # set to your ECR registry if images are private

api:
  replicaCount: 1        # single replica for test
  hpa:
    enabled: false       # disable HPA in test to save resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    className: nginx
    host: eks-upgrade-api.opsera-test.internal
    tlsSecretName: ""    # add if TLS is available in test cluster

web:
  replicaCount: 1
  pdb:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
    enabled: true
    className: nginx
    host: eks-upgrade.opsera-test.internal
    tlsSecretName: ""

healthAgent:
  replicaCount: 1
  env:
    CLUSTER_ID: "opsera-test-cluster"
    POLL_INTERVAL: "60s"
    LOG_LEVEL: debug

redis:
  enabled: true          # in-cluster Redis for test
  persistence:
    enabled: false       # no PVC needed in test

migrations:
  enabled: true

networkPolicy:
  enabled: false         # relax network policy in test for easier debugging
