replicaCount: 1

image:
  repository: ghcr.io/opsera/eks-upgrade-health-agent
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes", "pods", "namespaces", "persistentvolumes", "persistentvolumeclaims"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["storage.k8s.io"]
      resources: ["volumeattachments"]
      verbs: ["get", "list", "watch"]

service:
  type: ClusterIP
  port: 8080

env:
  CLUSTER_ID: ""
  HTTP_PORT: "8080"
  LOG_LEVEL: "info"

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
