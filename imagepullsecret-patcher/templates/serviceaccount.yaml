{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "imagepullsecret-patcher.serviceAccountName" . }}
  namespace: {{ include "imagepullsecret-patcher.fullname" . }}
  labels:
    {{- include "imagepullsecret-patcher.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "imagepullsecret-patcher.serviceAccountName" . }}
  labels:
    {{- include "imagepullsecret-patcher.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  - serviceaccounts
  verbs:
  - list
  - patch
  - create
  - get
  - delete
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - list
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "imagepullsecret-patcher.serviceAccountName" . }}
  labels:
    {{- include "imagepullsecret-patcher.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "imagepullsecret-patcher.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "imagepullsecret-patcher.serviceAccountName" . }}
    namespace: {{ include "imagepullsecret-patcher.serviceAccountName" . }}