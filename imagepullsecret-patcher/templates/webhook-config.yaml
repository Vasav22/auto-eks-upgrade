apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: add-imagepullsecret
webhooks:
  - name: webhook-server.imagepullsecret-patcher.svc
    clientConfig:
      service:
        name: webhook-server
        namespace: imagepullsecret-patcher
        path: "/mutate"
        port: 443
      caBundle: "This will be patched by helm prehook job"
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["serviceaccounts"]
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
