---
# Allows you to add any config files in /usr/share/filebeat
# such as filebeat.yml
filebeatConfig:
  filebeat.yml: |
    filebeat.inputs:
      - type: log
        enabled: true
        paths:
          - /var/lib/docker/volumes/*/_data/workspace/Cypress-test/examples/unit-testing__application-code/cypress-unit-test-results/*.xml
        exclude_lines: ['^<?xml']
        multiline.pattern: '<testsuite>'
        multiline.negate: true
        multiline.match: after
        multiline.flush_pattern: '</testsuite>'
        multiline.timeout: 1000

      - type: log

        # Change to true to enable this input configuration.
        enabled: true

        # Paths that should be crawled and fetched. Glob based paths.
        paths:
          - /var/jenkinslogs/*/junitResult.xml

        exclude_lines: ['^<?xml']

        # The regexp Pattern that has to be matched. The example pattern matches all lines starting with [
        multiline.pattern: '<suite>'
        multiline.negate: true
        multiline.match: after
        multiline.flush_pattern: '</suite>'
        multiline.timeout: 1000

      - type: log

        # Change to true to enable this input configuration.
        enabled: true

        # Paths that should be crawled and fetched. Glob based paths.
        paths:
          #- /var/lib/docker/volumes/*/_data/jobs/*/builds/*/performance-reports/JMeter/Sample-plan.csv
          - /var/lib/docker/volumes/*/_data/jobs/*/builds/*/archive/standardResults.xml
          #- c:\programdata\elasticsearch\logs\*

        ### Multiline options

        multiline.pattern: '<api>'
        multiline.negate: true
        multiline.match: after
        multiline.flush_pattern: '</api>'

      - type: log

        enabled: true
        paths:
          - /var/lib/docker/volumes/*/_data/workspace/release-pipeline/TestResults/*.xml
          - /var/lib/docker/volumes/*/_data/workspace/release-pipeline/*/*/TestResults/*.xml

      #adding build.xml and jenkins logs
      - type: log

        enabled: true
        paths:
          - /var/lib/docker/volumes/*/_data/jobs/*/builds/*/build.xml

        multiline.pattern: '^<?xml'
        multiline.negate: true
        multiline.match: after
        multiline.flush_pattern: '</build>'
        multiline.timeout: 120
        multiline.max_lines: 3000
        multiline.max_bytes: 20MB

    output.logstash:
      # The Logstash hosts
      hosts: ["opsera-logstash-opsera-elk-logstash.opsera.svc.cluster.local:5044"]
      ssl.enabled: false


# Extra environment variables to append to the DaemonSet pod spec.
# This will be appended to the current 'env:' key. You can use any of the kubernetes env
# syntax here
extraEnvs: []
#  - name: MY_ENVIRONMENT_VAR
#    value: the_value_goes_here

extraVolumeMounts: []
  # - name: extras
  #   mountPath: /usr/share/extras
  #   readOnly: true

extraVolumes: []
  # - name: extras
  #   emptyDir: {}

extraContainers: ""
# - name: dummy-init
#   image: busybox
#   command: ['echo', 'hey']

extraInitContainers: []
# - name: dummy-init
#   image: busybox
#   command: ['echo', 'hey']

envFrom: []
# - configMapRef:
#     name: configmap-name

# Root directory where Filebeat will write data to in order to persist registry data across pod restarts (file position and other metadata).
hostPathRoot: /var/lib
hostNetworking: false
image: "docker.elastic.co/beats/filebeat"
imageTag: "8.0.0-SNAPSHOT"
imagePullPolicy: "IfNotPresent"
imagePullSecrets: []

livenessProbe:
  exec:
    command:
      - sh
      - -c
      - |
        #!/usr/bin/env bash -e
        curl --fail 127.0.0.1:5066
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - |
        #!/usr/bin/env bash -e
        filebeat test output
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5

# Whether this chart should self-manage its service account, role, and associated role binding.
managedServiceAccount: true

# additionals labels
labels: {}

podAnnotations: {}
  # iam.amazonaws.com/role: es-cluster

# Various pod security context settings. Bear in mind that many of these have an impact on Filebeat functioning properly.
#
# - User that the container will execute as. Typically necessary to run as root (0) in order to properly collect host container logs.
# - Whether to execute the Filebeat containers as privileged containers. Typically not necessarily unless running within environments such as OpenShift.
podSecurityContext:
  runAsUser: 0
  privileged: false

resources:
  requests:
    cpu: "100m"
    memory: "100Mi"
  limits:
    cpu: "1000m"
    memory: "200Mi"

# Custom service account override that the pod will use
serviceAccount: ""

# Annotations to add to the ServiceAccount that is created if the serviceAccount value isn't set.
serviceAccountAnnotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/k8s.clustername.namespace.serviceaccount

# A list of secrets and their paths to mount inside the pod
# This is useful for mounting certificates for security other sensitive values
secretMounts: []
#  - name: filebeat-certificates
#    secretName: filebeat-certificates
#    path: /usr/share/filebeat/certs

# How long to wait for Filebeat pods to stop gracefully
terminationGracePeriod: 30

tolerations: []

nodeSelector: {}

affinity: {}

# This is the PriorityClass settings as defined in
# https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass
priorityClassName: ""

updateStrategy: RollingUpdate

# Override various naming aspects of this chart
# Only edit these if you know what you're doing
nameOverride: ""
fullnameOverride: ""
