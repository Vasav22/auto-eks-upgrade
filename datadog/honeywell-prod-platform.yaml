# Datadog Agent with Logs, APM, Processes, and System Probe enabled
# with specific configuration to work on AKS.

targetSystem: "linux"
datadog:
  apiKey: fbd3d7d2d9e097d76e8d81a5f193ca51
  appKey: d80cea2c-115b-50a5-8f2e-d5f1a73e9d5c
  clusterName: honeywell-prod-platform
  tags: 
    - cluster: honeywell-prod-platform
    - environment: prod
    - customer: honeywell
  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true
  processAgent:
    enabled: true
    processCollection: false
  leaderElection: false
  env: 
  - name: DD_CONTAINER_EXCLUDE
    value: "kube_namespace:opsera kube_namespace:kube-system kube_namespace:default kube_namespace:alertmanager image:kubernetesui/dashboard"
    

# agent:
#   customAgentConfig:
#     config_providers:
#       - name: endpointschecks
#         polling: true

clusterAgent:
  replicas: 2
  rbac:
    create: true
    serviceAccountName: default
  env: 
  - name: DD_COLLECT_KUBERNETES_EVENTS
    value: "true"
  - name: DD_LEADER_ELECTION
    value: "true"
