# Datadog Agent with Logs, APM, Processes, and System Probe enabled
# with specific configuration to work on AKS.

targetSystem: "linux"
datadog:
  apiKey: a09f33395b68795f7aaf2ec664a59835
  appKey: da2b9e89-8c87-537f-8f55-dd06edc84cf9
  clusterName: opsera-dev-platform
  tags: 
    - cluster: opsera-dev-platform
    - environment: dev
    - customer: opsera
  logs:
    enabled: false
    containerCollectAll: false
    containerCollectUsingFiles: false
  processAgent:
    enabled: false
    processCollection: false
  apm:
    enabled: false
  leaderElection: false

clusterAgent:
  replicas: 2
  rbac:
    create: true
    serviceAccountName: default
  env: 
  - name: DD_COLLECT_KUBERNETES_EVENTS
    value: "true"
  - name: DD_LEADER_ELECTION
    value: "true"