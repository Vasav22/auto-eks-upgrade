# Datadog Agent with Logs, APM, Processes, and System Probe enabled
# with specific configuration to work on AKS.

targetSystem: "linux"
datadog:
  apiKey: a09f33395b68795f7aaf2ec664a59835
  appKey: da2b9e89-8c87-537f-8f55-dd06edc84cf9
  clusterName: opsera-prod-platform
  tags: 
    - cluster: opsera-prod-platform
    - environment: prod
    - customer: opsera
  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true
  processAgent:
    enabled: true
    processCollection: false
  leaderElection: false
  env: 
    - name: DD_CONTAINER_EXCLUDE
      value: "kube_namespace:opsera kube_namespace:kube-system kube_namespace:default kube_namespace:alertmanager image:hazelcast/management-center image:kubernetesui/dashboard"
  confd:
    custom_check_nodeanalytics_service.yaml: |-
      init_config:
      instances:
        [{}]

# agent:
#   customAgentConfig:
#     config_providers:
#       - name: endpointschecks
#         polling: true

clusterAgent:
  replicas: 2
  rbac:
    create: true
    serviceAccountName: default
  env: 
  - name: DD_COLLECT_KUBERNETES_EVENTS
    value: "true"
  - name: DD_LEADER_ELECTION
    value: "true"