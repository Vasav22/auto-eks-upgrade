opseraConfig:
  mongo-d:
    cluster_check: true
    init_config: null
    instances:
    - custom_queries:
      - count_type: gauge
        database: opsera
        metric_prefix: opsera.mongo.collection.useractivities.count
        query:
          count: useractivities
        tags:
        - replicaname:primary-0
        - cluster_name:opsera-freetrial-platform
        - kube_namespace:opsera
        - collection:useractivities
      - count_type: gauge
        database: opsera
        metric_prefix: opsera.mongo.collection.pipelines.count
        query:
          count: pipelines
        tags:
        - replicaname:primary-0
        - cluster_name:opsera-freetrial-platform
        - kube_namespace:opsera
        - collection:pipelines
      - count_type: gauge
        database: opsera
        metric_prefix: opsera.mongo.collection.ssousers.count
        query:
          count: ssoUsers
        tags:
        - replicaname:primary-0
        - cluster_name:opsera-freetrial-platform
        - kube_namespace:opsera
        - collection:ssoUsers
      database: admin
      hosts:
      - mongodb.opsera.svc.cluster.local:27017
      password: '%%env_DATADOG_MONGO_PASSWORD%%'
      replica_check: true
      tags:
      - replicaname:primary-0
      - cluster_name:opsera-freetrial-platform
      - kube_namespace:opsera
      username: datadog
