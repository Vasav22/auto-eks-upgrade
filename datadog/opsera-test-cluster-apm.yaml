clusterAgent:
  replicas: 2
  rbac:
    create: true
    serviceAccountName: default
  env: 
  - name: DD_COLLECT_KUBERNETES_EVENTS
    value: "true"
  - name: DD_LEADER_ELECTION
    value: "true"