# Datadog Agent with Logs, APM, Processes, and System Probe enabled
# with specific configuration to work on AKS.

targetSystem: "linux"
datadog:
  apiKey: a09f33395b68795f7aaf2ec664a59835
  appKey: da2b9e89-8c87-537f-8f55-dd06edc84cf9
  clusterName: opsera-test-platform
  tags: 
    - cluster: opsera-test-platform
    - environment: test
    - customer: opsera
  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true
  processAgent:
    enabled: true
    processCollection: false
  leaderElection: false
  env: 
    - name: DD_CONTAINER_EXCLUDE
      value: "kube_namespace:opsera kube_namespace:kube-system kube_namespace:default image_name:gcr.io/datadoghq/agent image_name:docker.elastic.co/beats/metricbeat"


