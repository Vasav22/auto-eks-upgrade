apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_HOST
          value: postgres.backstage
        - name: POSTGRES_PORT
          value: "5432"
        envFrom:
        - secretRef:
            name: postgres-secrets
        image: postgres:13.2-alpine
        name: postgres
        ports:
        - containerPort: 5432
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 1G
          limits:
            cpu: 250m
            memory: 1G
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgresdb
          subPath: data
      volumes:
      - name: postgresdb
        persistentVolumeClaim:
          claimName: postgres-storage-claim
