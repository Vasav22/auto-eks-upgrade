apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsera-nagios.fullname" . }}
  labels:
    {{- include "opsera-nagios.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "opsera-nagios.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsera-nagios.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "opsera-nagios.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:          
          - name: "GRAFANA_PASSWORD"
            valueFrom:
              secretKeyRef:
                key:  grafana_password
                name: {{ include "opsera-nagios.fullname" . }}-auth
          - name: "NAGIOS_PASSWORD"
            valueFrom:
              secretKeyRef:
                key:  nagios_password
                name: {{ include "opsera-nagios.fullname" . }}-auth
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
