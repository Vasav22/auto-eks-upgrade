  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

password: Whn8Bd@M*
username: elastic
username_password: ZWxhc3RpYzpXaG44QmRATSo=
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 9200

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/secure-backends: "true"
    ingress.kubernetes.io/ssl-passthrough: "true"
    # nginx.ingress.kubernetes.io/rewrite-target: /kibana/*
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # kubernetes.io/ingress.global-static-ip-name: bbtest
    # networking.gke.io/managed-certificates: bb-opsera-example-certificate
  hosts:
    - host: bbtest.opsera.io
      paths: [/]
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 1
    memory: 4Gi
  requests:
    cpu: 1
    memory: 2Gi

nodeSelector:
  Name: opsera-node

tolerations: []

affinity: {}
