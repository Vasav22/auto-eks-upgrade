{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "health-agent.serviceAccountName" . }}
  labels:
    {{- include "health-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "health-agent.fullname" . }}
  labels:
    {{- include "health-agent.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.clusterRole.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "health-agent.fullname" . }}
  labels:
    {{- include "health-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "health-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "health-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
