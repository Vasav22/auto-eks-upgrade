{{- if .Values.networkPolicy.enabled }}
---
# Allow API to receive traffic from ingress and web
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eks-upgrade-api-policy
  namespace: {{ include "eks-upgrade.namespace" . }}
  labels:
    {{- include "eks-upgrade.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.api.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.web.name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.healthAgent.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    - {}   # Allow all egress (DB, Redis, AWS APIs, OIDC)
---
# Allow web to receive from ingress only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eks-upgrade-web-policy
  namespace: {{ include "eks-upgrade.namespace" . }}
  labels:
    {{- include "eks-upgrade.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.web.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.web.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.api.name }}
---
# Allow Redis to receive from API and migrations only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eks-upgrade-redis-policy
  namespace: {{ include "eks-upgrade.namespace" . }}
  labels:
    {{- include "eks-upgrade.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.redis.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.api.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
{{- end }}
