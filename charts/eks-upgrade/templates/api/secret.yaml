{{- if .Values.api.enabled }}
{{- if or .Values.api.env.DATABASE_URL .Values.api.env.DATABASE_PASSWORD .Values.api.env.JWT_SECRET .Values.api.env.OIDC_CLIENT_SECRET .Values.api.env.CREDENTIAL_ENCRYPTION_KEY .Values.api.env.ENCRYPTION_KEY }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.name }}-secrets
  namespace: {{ include "eks-upgrade.namespace" . }}
  labels:
    {{- include "eks-upgrade.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.api.env.DATABASE_URL }}
  DATABASE_URL: {{ .Values.api.env.DATABASE_URL | quote }}
  {{- end }}
  {{- if .Values.api.env.DATABASE_PASSWORD }}
  DATABASE_PASSWORD: {{ .Values.api.env.DATABASE_PASSWORD | quote }}
  {{- end }}
  {{- if .Values.api.env.JWT_SECRET }}
  JWT_SECRET: {{ .Values.api.env.JWT_SECRET | quote }}
  {{- end }}
  {{- if .Values.api.env.OIDC_CLIENT_SECRET }}
  OIDC_CLIENT_SECRET: {{ .Values.api.env.OIDC_CLIENT_SECRET | quote }}
  {{- end }}
  {{- if .Values.api.env.OIDC_ISSUER }}
  OIDC_ISSUER: {{ .Values.api.env.OIDC_ISSUER | quote }}
  {{- end }}
  {{- if .Values.api.env.OIDC_CLIENT_ID }}
  OIDC_CLIENT_ID: {{ .Values.api.env.OIDC_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.api.env.CREDENTIAL_ENCRYPTION_KEY }}
  CREDENTIAL_ENCRYPTION_KEY: {{ .Values.api.env.CREDENTIAL_ENCRYPTION_KEY | quote }}
  {{- end }}
  {{- if .Values.api.env.ENCRYPTION_KEY }}
  ENCRYPTION_KEY: {{ .Values.api.env.ENCRYPTION_KEY | quote }}
  {{- end }}
  {{- if .Values.api.env.REDIS_URL }}
  REDIS_URL: {{ .Values.api.env.REDIS_URL | quote }}
  {{- end }}
{{- end }}
{{- end }}
