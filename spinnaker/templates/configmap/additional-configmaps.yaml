{{ if  .Values.halyard.additionalConfigMaps.create -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "spinnaker.fullname" . }}-additional-config-maps
  labels:
{{ include "spinnaker.standard-labels" . | indent 4 }}
data:
  config.src: |-
    GATE_URL={{ .Values.halyard.GATE_URL }} # URL to access your gate
    DECK_URL={{ .Values.halyard.DECK_URL }} # Url to access your deck
{{- end }}
