apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsera-jenkin.fullname" . }}
  annotations:
    service.kubernetes.io/topology-mode: auto
  labels:
    {{- include "opsera-jenkin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - name: jenkins-jnlp
      port: 50000
      protocol: TCP
      targetPort: 50000
  selector:
    {{- include "opsera-jenkin.selectorLabels" . | nindent 4 }}
