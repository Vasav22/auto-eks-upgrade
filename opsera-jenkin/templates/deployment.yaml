apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "opsera-jenkin"
  labels:
    {{- include "opsera-jenkin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "opsera-jenkin.selectorLabels" . | nindent 6 }}
  serviceName: "opsera-jenkin"
  template:
    metadata:
      labels:
        {{- include "opsera-jenkin.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "opsera-jenkin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: take-data-dir-ownership
        image: alpine:3
        command: ['sh', '-c', 'chmod -R 777  /temp/jenkins_home']
        volumeMounts:
        - name: my-disk-claim-1
          mountPath: /temp/jenkins_home
      - name: copy-data
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: ['sh', '-c', 'cp -r /var/jenkins_home/* /temp/jenkins_home/']
        volumeMounts:
        - name: my-disk-claim-1
          mountPath: /temp/jenkins_home
      - name: volume-permissions
        image: busybox
        command: ['sh', '-c', 'chmod -R 777  /var/jenkins_home; mv -vn /temp/jenkins_home/* /var/jenkins_home/']
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        - name: my-disk-claim-1
          mountPath: /temp/jenkins_home
      containers:
        - name: jenkins
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: JENKINS_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                key:  password
                name: {{ include "opsera-jenkin.fullname" . }}-auth
          - name: JENKINS_UI_URL
            value: {{ .Values.JENKINS_UI_URL }}
          - name: JENKINS_OPTS
            value: --prefix=/
          - name: KUBERNETES_URL
            value: {{ .Values.KUBERNETES_URL }}
          - name: KUBERNETES_NAMESPACE
            value: {{ .Values.KUBERNETES_NAMESPACE }}
          - name: JENKINS_WORKSPACE_EFS
            value: {{ include "opsera-jenkin.fullname" . }}-efs
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: jnlp-port
              containerPort: 50000
          volumeMounts:
          - mountPath: "/var/jenkins_home"
            name: jenkins-home
          - name: dockersock
            mountPath: "/var/run/docker.sock"
          # readinessProbe:
          #   httpGet:
          #     path: /login
          #     port: {{ .Values.service.port }}
          #   initialDelaySeconds: 120
          #   periodSeconds: 60
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: my-disk-claim-1
        persistentVolumeClaim:
          claimName: my-disk-claim-1
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-home
      - name: dockersock
        hostPath:
          path: /var/run/docker.sock
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
