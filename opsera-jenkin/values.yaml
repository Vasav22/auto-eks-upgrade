# Default values for opsera-jenkin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-pipeline/jenkins-lts
  tag: latest
  # repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/releasemanagement/jenkins-multilang
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

password: Whn8Bd"@M*
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 8080

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    #nginx.ingress.kubernetes.io/rewrite-target: /*
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # kubernetes.io/ingress.global-static-ip-name: bbtest
    networking.gke.io/managed-certificates: bb-opsera-example-certificate
    nginx.ingress.kubernetes.io/proxy-redirect-from: http://jenkins-nawaz03.iwin.opsera.io:8000/
    nginx.ingress.kubernetes.io/proxy-redirect-to: https://jenkins-nawaz03.iwin.opsera.io/
  hosts:
    - host: sundar.opsera.io
      paths: [/*]
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 2
    memory: 4Gi
  requests:
    cpu: 2
    memory: 2Gi

nodeSelector:
  Name: tools-node

tolerations: []

affinity: {}

JENKINS_CRONJOB_URL: http://opsera-jenkins:8080
