{{- if .Values.server.opseraUser.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-opsera-cm
  labels:
    {{- include "argo-cd.labels" (dict "context" . "component" .Values.server.name "name" "cm") | nindent 4 }}
  {{- if .Values.server.configAnnotations }}
  annotations:
  {{- range $key, $value := .Values.server.configAnnotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
data:
{{ (.Files.Glob "Files/opsera_argocd.sh").AsConfig | indent 2 }}
{{- end }}