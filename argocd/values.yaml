  ## Enable Admin ClusterRole resources.
  ## Enable if you would like to grant rights to ArgoCD to deploy to the local Kubernetes cluster.
  clusterAdminAccess:
    enabled: true

  ## Enable BackendConfig custom resource for Google Kubernetes Engine
  GKEbackendConfig:
    enabled: false
    spec: {}
  #  spec:
  #    iap:
  #      enabled: true
  #      oauthclientCredentials:
  #        secretName: argocd-secret
  GKEmanagedCertificate:
    enabled: false
    domains:
    - argocd.example.com
  GKEfrontendConfig:
    enabled: false
    spec: {}
  extraContainers: []
  initContainers: []
  extensions:
    enabled: false
    image:
      repository: "ghcr.io/argoproj-labs/argocd-extensions"
      tag: "v0.1.0"
      imagePullPolicy: IfNotPresent
    resources: {}
    contents: []
  pdb:
    labels: {}
    annotations: {}
    enabled: false

## Repo Server
repoServer:
  name: repo-server

  replicas: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50

  image:
    repository: # argoproj/argocd
    tag: # v1.6.1
    imagePullPolicy: # IfNotPresent

  ## Additional command line arguments to pass to argocd-repo-server
  ##
  extraArgs: []

  ## Environment variables to pass to argocd-repo-server
  ##
  env: []

  envFrom: []

  ## Argo repoServer log level
  logFormat: text
  logLevel: info

  ## Annotations to be added to repo server pods
  ##
  podAnnotations: {}

  ## Labels to be added to repo server pods
  ##
  podLabels: {}

  ## Configures the repo server port
  containerPort: 8081

  ## Readiness and liveness probes for default backend
  ## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/
  ##
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1

  ## Additional volumeMounts to the repo server main container.
  volumeMounts: []

  ## Additional volumes to the repo server pod.
  volumes: []

  ## Node selectors and tolerations for server scheduling to nodes with taints
  ## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
  ##
  nodeSelector:
    Name: tools-node
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

  priorityClassName: ""

  ## Labels to set container specific security contexts
  containerSecurityContext: {}
    # capabilities:
    #   drop:
    #     - all

  resources:
    limits:
      cpu: 100m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 2Gi

  ## Repo server service configuration
  service:
    annotations: {}
    labels: {}
    port: 8081
    portName: https-repo-server

  ## Repo server metrics service configuration
  metrics:
    enabled: false
    service:
      annotations: {}
      labels: {}
      servicePort: 8084
    serviceMonitor:
      enabled: false
      interval: 30s
      relabelings: []
      metricRelabelings: []
      selector: {}
      namespace: "" # "monitoring"
      additionalLabels: {}

  clusterAdminAccess:
    enabled: false
  clusterRoleRules:
    enabled: false
    rules: []

  ## Repo server service account
  ## If create is set to true, make sure to uncomment the name and update the rbac section below
  serviceAccount:
    create: false
    name: ""
    #  name: argocd-repo-server
    ## Annotations applied to created service account
    annotations: {}
    automountServiceAccountToken: true
  extraContainers: []
  rbac: []
  ## Repo server rbac rules
  # rbac:
  #   - apiGroups:
  #     - argoproj.io
  #     resources:
  #     - applications
  #     verbs:
  #     - get
  #     - list
  #     - watch

  # Init container to copy argocd binary
  copyutil:
    # -- Resource limits and requests for the copyutil initContainer
    resources: {}
    #  limits:
    #    cpu: 50m
    #    memory: 64Mi
    #  requests:
    #    cpu: 10m
    #    memory: 32Mi

  pdb:
    # -- Labels to be added to Repo server pdb
    labels: {}
    # -- Annotations to be added to Repo server pdb
    annotations: {}
    # -- Deploy a Poddisruptionbudget for the Repo server
    enabled: false
    # minAvailable: 1
    # maxUnavailable: 0

  ## Use init containers to configure custom tooling
  ## https://argoproj.github.io/argo-cd/operator-manual/custom_tools/
  ## When using the volumes & volumeMounts section bellow, please comment out those above.
 #  volumes:
 #  - name: custom-tools
 #    emptyDir: {}
 #
 #  initContainers:
 #  - name: download-tools
 #    image: alpine:3.8
 #    command: [sh, -c]
 #    args:
 #      - wget -qO- https://get.helm.sh/helm-v2.16.1-linux-amd64.tar.gz | tar -xvzf - &&
 #        mv linux-amd64/helm /custom-tools/
 #    volumeMounts:
 #      - mountPath: /custom-tools
 #        name: custom-tools
 #  volumeMounts:
 #  - mountPath: /usr/local/bin/helm
 #    name: custom-tools
 #    subPath: helm

