apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-server-sa
  namespace: imagepullsecret-patcher
  labels:
    app: webhook-server-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-server-sa-cluster-role
rules:
  - apiGroups: [ "admissionregistration.k8s.io" ]
    resources: [ "mutatingwebhookconfigurations" ]
    verbs: [ "get", "create", "patch" ]
  - apiGroups: [ "" ]
    resources: [ "secrets" ]
    verbs: [ "create", "get", "patch","update","delete" ]
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "list", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-server-sa-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webhook-server-sa-cluster-role
subjects:
  - kind: ServiceAccount
    name: webhook-server-sa
    namespace: imagepullsecret-patcher
