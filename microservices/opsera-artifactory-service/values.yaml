# Default values for opsera-artifactory-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-artifactory-service
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
 
  

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 512Mi

nodeSelector:
  Name: microservice-node

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 300
  targetMemoryUtilizationPercentage: 240
  
tolerations: []

affinity: {}

extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_API_SERVICE_URL
    secretKey: OPSERA_API_SERVICE_URL
  - secretName: microservices-ms-env
    envName: OPSERA_KAFKA_BOOTSTRAP_URL
    secretKey: OPSERA_KAFKA_BOOTSTRAP_URL
  - secretName: microservices-ms-env
    envName: OPSERA_HAZELCAST_K8_SERVICE_DNS
    secretKey: OPSERA_HAZELCAST_K8_SERVICE_DNS

serviceCategory: Artifact_CI_Services


DOCKER_ENV: kubernetes

CONTAINER_PORT: 8109
