apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "opsera-artifactory-service.fullname" . }}-test-connection"
  labels:
    {{- include "opsera-artifactory-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera/busybox:1.32
      command: ['wget']
      args: ['{{ include "opsera-artifactory-service.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
