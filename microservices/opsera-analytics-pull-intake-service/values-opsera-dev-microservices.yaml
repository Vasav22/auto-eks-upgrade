resources:
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 120

#enable ingress for DEV work only, this should not be done for TEST or other platform tiers
ingress:
  enabled: true
  hosts:
    - host: analytics-pull-intake-service.opsera-dev-private.opsera.io
      paths:
        - path: /
          pathType: ImplementationSpecific
