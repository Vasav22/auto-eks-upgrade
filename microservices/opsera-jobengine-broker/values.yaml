# Default values for opsera-jobengine-broker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-jobengine-broker-service
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: [/]
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 300
  targetMemoryUtilizationPercentage: 120

nodeSelector:
  Name: microservice-node

tolerations: []

affinity: {}

extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_DB_HOST
    secretKey: OPSERA_DB_HOST
  - secretName: microservices-ms-env
    envName: OPSERA_DB_NAME
    secretKey: OPSERA_DB_NAME
  - secretName: microservices-ms-env
    envName: OPSERA_DB_USER
    secretKey: OPSERA_DB_USER
  - secretName: microservices-ms-env
    envName: OPSERA_DB_PASSWORD
    secretKey: OPSERA_DB_PASSWORD
  - secretName: microservices-ms-env
    envName: OPSERA_REDIS_HOST
    secretKey: OPSERA_REDIS_HOST
  - secretName: microservices-ms-env
    envName: OPSERA_KAFKA_CLIENT_ID
    secretKey: OPSERA_KAFKA_CLIENT_ID
  - secretName: microservices-ms-env
    envName: OPSERA_KAFKA_BORKERS
    secretKey: OPSERA_KAFKA_BORKERS
  - secretName: microservices-ms-env
    envName: OPSERA_API_GATEWAY_API_URL
    secretKey: OPSERA_API_GATEWAY_API_URL
  - secretName: microservices-ms-env
    envName: OPSERA_WEBHOOK_PROCESS
    secretKey: OPSERA_WEBHOOK_PROCESS
  - secretName: microservices-ms-env
    envName: OPSERA_ORCHESTRATION_URL
    secretKey: OPSERA_ORCHESTRATION_URL
  - secretName: microservices-ms-env
    envName: OPSERA_ENV
    secretKey: OPSERA_ENV
  - secretName: microservices-ms-env
    envName: OPSERA_API_GATEWAY_SERVICE_URL
    secretKey: OPSERA_API_GATEWAY_SERVICE_URL
  - secretName: microservices-ms-env
    envName: OPSERA_API_GATEWAY_SERVICE_PASS
    secretKey: OPSERA_API_GATEWAY_SERVICE_PASS

serviceCategory: Platform_Services