resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 240

ingress:
  enabled: true
  hosts:
    - host: node-tokens-service.opsera-dev-private.opsera.io
      paths: [/]

NODE_ENV: testing
