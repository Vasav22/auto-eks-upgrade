resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3

  targetCPUUtilizationPercentage: 280
  targetMemoryUtilizationPercentage: 70
ingress:
  enabled: true
  hosts:
    - host: node-tokens-service.opsera-test-private.opsera.io
      paths: [/]

NODE_ENV: testing
