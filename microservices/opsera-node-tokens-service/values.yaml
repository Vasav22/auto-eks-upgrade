# Default values for opsera-node-tokens-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-node-tokens-service
  pullPolicy: Always
  tag: test

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: chart-example.local
      paths: [/]
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 1Gi

nodeSelector:
  Name: microservice-node

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 240
  targetMemoryUtilizationPercentage: 120

tolerations: []

affinity: {}

extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_DB_HOST
    secretKey: OPSERA_DB_HOST
  - secretName: microservices-ms-env
    envName: OPSERA_DB_NAME
    secretKey: OPSERA_DB_NAME
  - secretName: microservices-ms-env
    envName: OPSERA_DB_USER
    secretKey: OPSERA_DB_USER
  - secretName: microservices-ms-env
    envName: OPSERA_DB_PASSWORD
    secretKey: OPSERA_DB_PASSWORD
  - secretName: microservices-ms-env
    envName: OPSERA_REDIS_HOST
    secretKey: OPSERA_REDIS_HOST
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_CLIENT_ID
    secretKey: OPSERA_OKTA_CLIENT_ID
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_ISSUER
    secretKey: OPSERA_OKTA_ISSUER
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_ASSERT_CID
    secretKey: OPSERA_OKTA_ASSERT_CID
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_TOKEN
    secretKey: OPSERA_OKTA_TOKEN
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_ORG_URL
    secretKey: OPSERA_OKTA_ORG_URL
  - secretName: microservices-ms-env
    envName: OPSERA_CLIENT_URL
    secretKey: OPSERA_CLIENT_URL
  - secretName: microservices-ms-env
    envName: OPSERA_ENV
    secretKey: OPSERA_ENV
  - secretName: microservices-ms-env
    envName: OPSERA_API_GATEWAY_SERVICE_URL
    secretKey: OPSERA_API_GATEWAY_SERVICE_URL

serviceCategory: Client_API_Services
