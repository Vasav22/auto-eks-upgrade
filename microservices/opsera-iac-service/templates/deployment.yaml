apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsera-iac-service.fullname" . }}
  labels:
    {{- include "opsera-iac-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "opsera-iac-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        {{ if .Values.serviceCategory }}
        serviceCategory: {{ .Values.serviceCategory }}
        {{ end }}
        {{- include "datadogApm.selectorLabels" . | nindent 8 }}
        {{- include "opsera-iac-service.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "opsera-iac-service.serviceAccountName" . }}
      terminationGracePeriodSeconds: 900
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "datadogApm.initContainer" . | nindent 6 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.CONTAINER_PORT }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 40
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 40
          lifecycle:
            preStop:
              httpGet:
                path: /stopListener
                port: http
                scheme: HTTP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          {{- include "datadogApm.environmentVars" . | nindent 10 }}
          - name: "DOCKER_ENV"
            value: {{ .Values.DOCKER_ENV }}
          - name: CONTAINER_PORT
            value: "{{ .Values.CONTAINER_PORT }}"
          - name: OPSERA_HELM_GIT_BRANCH_NAME
            value: {{ .Values.OPSERA_HELM_GIT_BRANCH_NAME }}
          - name: "TF_VAR_control_plane_env"
            value: {{ .Values.CONTROL_PLANE_ENV }}
          - name: "TF_VAR_control_plane_env_sqs"
            value: {{ .Values.CONTROL_PLANE_ENV_SQS }}
          {{- include "ms.extraSecretEnvironmentVars" .Values | nindent 10 }}
          volumeMounts:
          {{- include "datadogApm.volumeMounts" . | nindent 10 }}
          - name: microservices-efs
            mountPath: /apps/OpsERA/logs/components/
      volumes:
        {{- include "datadogApm.volumes" . | nindent 8 }}
        - name: microservices-efs
          persistentVolumeClaim:
            claimName: microservices-efs
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}

