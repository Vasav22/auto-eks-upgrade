# Default values for opsera-reactapp-insight-v2.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-reactapp-insight-v2
  pullPolicy: Always
  tag: test

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "INGRESSCOOKIEREACT"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 512Mi

nodeSelector:
  Name: microservice-node

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 300
  targetMemoryUtilizationPercentage: 240

tolerations: []

affinity: {}

extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_REDIRECTURI
    secretKey: OPSERA_INSIGHT_V2_OKTA_REDIRECTURI
  - secretName: microservices-ms-env
    envName: OPSERA_NODE_SERVER_URL 
    secretKey: OPSERA_NODE_SERVER_URL
  - secretName: microservices-ms-env
    envName: OPSERA_CLIENT_URL
    secretKey: OPSERA_INSIGHT_V2_CLIENT_URL
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_CLIENT_ID
    secretKey: OPSERA_OKTA_CLIENT_ID
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_ISSUER
    secretKey: OPSERA_OKTA_ISSUER
  - secretName: microservices-ms-env
    envName: OPSERA_OKTA_ORG_URL
    secretKey: OPSERA_OKTA_ORG_URL
  - secretName: microservices-ms-env
    envName: OPSERA_ENV
    secretKey: OPSERA_ENV
  - secretName: microservices-ms-env
    envName: OPSERA_ORCHESTRATION_SECRET
    secretKey: OPSERA_ORCHESTRATION_SECRET
  - secretName: microservices-ms-env
    envName: OPSERA_S3_STORAGE_URL
    secretKey: OPSERA_S3_STORAGE_URL
  - secretName: microservices-ms-env
    envName: OPSERA_TENANT
    secretKey: OPSERA_TENANT
  - secretName: microservices-ms-env
    envName: OPSERA_APP_STACK
    secretKey: OPSERA_APP_STACK
  - secretName: microservices-ms-env
    envName: OPSERA_ANALYTICS_BASE_URL
    secretKey: OPSERA_NODE_INSIGHTSV2_SERVER_URL



