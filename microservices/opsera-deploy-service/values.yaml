# Default values for opsera-deploy-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-deploy-service
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false

  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 750m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

nodeSelector:
  Name: microservice-node

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 450
  targetMemoryUtilizationPercentage: 120

tolerations: []

affinity: {}

extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_HAZELCAST_K8_SERVICE_DNS
    secretKey: OPSERA_HAZELCAST_K8_SERVICE_DNS
  - secretName: microservices-ms-env
    envName: OPSERA_API_SERVICE_URL
    secretKey: OPSERA_API_SERVICE_URL
  - secretName: microservices-ms-env
    envName: OPSERA_KAFKA_BOOTSTRAP_URL
    secretKey: OPSERA_KAFKA_BOOTSTRAP_URL
  - secretName: microservices-ms-env
    envName: OPSERA_VAULT_AUTH_ROLE
    secretKey: OPSERA_VAULT_AUTH_ROLE
  - secretName: microservices-ms-env
    envName: OPSERA_VAULT_URI
    secretKey: OPSERA_VAULT_URI
  - secretName: microservices-ms-env
    envName: OPSERA_VAULT_ENCRYPTION_KEY
    secretKey: OPSERA_VAULT_ENCRYPTION_KEY
  - secretName: microservices-ms-env
    envName: OPSERA_AWS_ACCESS_KEY
    secretKey: OPSERA_AWS_ACCESS_KEY
  - secretName: microservices-ms-env
    envName: OPSERA_AWS_SECRET_KEY
    secretKey: OPSERA_AWS_SECRET_KEY
  - secretName: microservices-ms-env
    envName: OPSERA_AWS_HOSTER_ZONEID
    secretKey: OPSERA_AWS_HOSTER_ZONEID


CONTAINER_PORT: 8119

serviceCategory: Artifact_CI_Services
