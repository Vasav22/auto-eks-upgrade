resources:
  limits:
    cpu: 2
    memory: 4Gi
  requests:
    cpu: 1
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

ingress:
  enabled: false
  hosts:
    - host: orchestration-service.opsera-test-private.opsera.io
      paths:
        - path: /
          pathType: ImplementationSpecific

NODE_ENV: testing

