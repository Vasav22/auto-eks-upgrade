resources:
  limits:
    cpu: 3300m
    memory: 4800Mi
  requests:
    cpu: 1500m
    memory: 4800Mi

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 4

  targetCPUUtilizationPercentage: 154
  targetMemoryUtilizationPercentage: 60
ingress:
  enabled: false
  hosts:
    - host: orchestration-service.honeywell-platform-private.opsera.io
      paths:
        - path: /
          pathType: ImplementationSpecific

