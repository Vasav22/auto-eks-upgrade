resources:
  limits:
    cpu: 3300m
    memory: 4800Mi
  requests:
    cpu: 1500m
    memory: 4800Mi

autoscaling:
  enabled: true
  minReplicas: 6
  maxReplicas: 6

ingress:
  enabled: false
  hosts:
    - host: orchestration-service.opsera-prod-private.opsera.io
      paths:
        - path: /
          pathType: ImplementationSpecific

