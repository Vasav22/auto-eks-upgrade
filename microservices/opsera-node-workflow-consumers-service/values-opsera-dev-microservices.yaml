resources:
  limits:
    cpu: 1
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetMemoryUtilizationPercentage: 240

ingress:
  hosts:
    - host: api.opsera-dev.opsera.io
      paths: [/node-github-service/]

NODE_ENV: testing
