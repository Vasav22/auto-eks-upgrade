resources:
  limits:
    cpu: 2
    memory: 4Gi
  requests:
    cpu: 1
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 160
  targetMemoryUtilizationPercentage: 80

ingress:
  hosts:
    - host: vnext-api.opsera-test-private.opsera.io
      paths: [/]

NODE_ENV: testing
