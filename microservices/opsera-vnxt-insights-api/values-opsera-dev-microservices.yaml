resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 120
  targetMemoryUtilizationPercentage: 120

ingress:
  hosts:
    - host: vnext-insights-api.opsera-dev.opsera.io
      paths: [/]

NODE_ENV: testing
