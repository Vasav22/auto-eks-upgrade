autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2

  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
ingress:
  enabled: true
  hosts:
  - host: opsera-node-platform-service.opsera-test-private.opsera.io
    paths: 
    - path: /

NODE_ENV: testing

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 1Gi