# Default values for opsera-node-public-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-node-public-api
  pullPolicy: Always
  tag: test

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "false"
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: 
      - path: /api
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 1Gi

nodeSelector:
  Name: microservice-node

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

tolerations: []

affinity: {}

KAFKA_CLIENT: "opsera-node-public-api"

extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_DB_HOST
    secretKey: OPSERA_DB_HOST
  - secretName: microservices-ms-env
    envName: OPSERA_DB_NAME
    secretKey: OPSERA_DB_NAME
  - secretName: microservices-ms-env
    envName: OPSERA_DB_USER
    secretKey: OPSERA_DB_USER
  - secretName: microservices-ms-env
    envName: OPSERA_DB_PASSWORD
    secretKey: OPSERA_DB_PASSWORD
  - secretName: microservices-ms-env
    envName: OPSERA_REDIS_HOST
    secretKey: OPSERA_REDIS_HOST
  - secretName: microservices-ms-env
    envName: OPSERA_KAFKA_BROKERS
    secretKey: OPSERA_KAFKA_BORKERS
  - secretName: microservices-ms-env
    envName: OPSERA_LDAP_URL
    secretKey: OPSERA_LDAP_URL
  - secretName: microservices-ms-env
    envName: OPSERA_LDAP_SERVICE_ACC_PASS
    secretKey: OPSERA_LDAP_SERVICE_ACC_PASS
  - secretName: microservices-ms-env
    envName: LDAP_DIR_ACC_PASS
    secretKey: LDAP_DIR_ACC_PASS
  - secretName: microservices-ms-env
    envName: OPSERA_ENV
    secretKey: OPSERA_ENV
  - secretName: microservices-ms-env
    envName: OPSERA_ORCHESTRATION_SECRET
    secretKey: OPSERA_ORCHESTRATION_SECRET
  - secretName: microservices-ms-env
    envName: OPSERA_API_GATEWAY_API_URL
    secretKey: OPSERA_API_GATEWAY_API_URL
  - secretName: microservices-ms-env
    envName: OPSERA_CLIENT_URL
    secretKey: OPSERA_CLIENT_URL

serviceCategory: Client_API_Services