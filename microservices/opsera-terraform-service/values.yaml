# Default values for opsera-terraform-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-terraform-service
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 1Gi

nodeSelector:
  Name: microservice-node

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

tolerations: []

affinity: {}

extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_VAULT_TOKEN
    secretKey: OPSERA_VAULT_TOKEN
  - secretName: microservices-ms-env
    envName: OPSERA_VAULT_HELM_URI
    secretKey: OPSERA_VAULT_HELM_URI
  - secretName: microservices-ms-env
    envName: OPSERA_VAULT_IP_URL
    secretKey: OPSERA_VAULT_IP_URL
  - secretName: microservices-ms-env
    envName: OPSERA_KAFKA_BOOTSTRAP_URL
    secretKey: OPSERA_KAFKA_BOOTSTRAP_URL
  - secretName: microservices-ms-env
    envName: OPSERA_API_SERVICE_URL
    secretKey: OPSERA_API_SERVICE_URL
  - secretName: microservices-ms-env
    envName: OPSERA_KAFKA_SERVER
    secretKey: OPSERA_KAFKA_SERVER
  - secretName: microservices-ms-env
    envName: OPSERA_PLATFORM_VPCID
    secretKey: OPSERA_PLATFORM_VPCID
  - secretName: microservices-ms-env
    envName: OPSERA_GIT_BRANCH_NAME
    secretKey: OPSERA_GIT_BRANCH_NAME
  - secretName: microservices-ms-env
    envName: OPSERA_PLATFORM_TRANSIT_GATEWAY
    secretKey: OPSERA_PLATFORM_TRANSIT_GATEWAY
  - secretName: microservices-ms-env
    envName: OPSERA_API_NODE_URL
    secretKey: OPSERA_API_NODE_URL
  - secretName: microservices-ms-env
    envName: OPSERA_PLATFORM_ROUTETABLE_ID
    secretKey: OPSERA_PLATFORM_ROUTETABLE_ID
  - secretName: microservices-ms-env
    envName: OPSERA_PLATFORM_DOMAIN
    secretKey: OPSERA_PLATFORM_DOMAIN

HELM_GIT_BRANCH: master
