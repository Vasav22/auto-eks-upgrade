apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsera-git-service.fullname" . }}
  labels:
    {{- include "opsera-git-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "opsera-git-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        {{ if .Values.serviceCategory }}
        serviceCategory: {{ .Values.serviceCategory }}
        {{ end }}
        {{- include "datadogApm.selectorLabels" . | nindent 8 }}
        {{- include "opsera-git-service.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "opsera-git-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "datadogApm.initContainer" . | nindent 6 }}
      initContainers:
        - name: cert-setup
          image: eclipse-temurin:17-jdk
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /truststore
              for f in /certs/*.pem; do
                cp "$f" "/usr/local/share/ca-certificates/$(basename "${f%.pem}.crt")"
              done
              update-ca-certificates
              cp /etc/ssl/certs/ca-certificates.crt /truststore/

              TRUSTSTORE=/truststore/custom-cacerts
              cp $JAVA_HOME/lib/security/cacerts $TRUSTSTORE

              for cert in /certs/*.pem; do
                alias=$(basename "$cert" .pem)
                keytool -importcert -noprompt -trustcacerts \
                  -keystore "$TRUSTSTORE" -storepass changeit \
                  -alias "$alias" -file "$cert"
              done
          volumeMounts:
            - name: certs-volume
              mountPath: /certs
            - name: truststore-volume
              mountPath: /truststore
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.CONTAINER_PORT }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 40
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 40
          lifecycle:
            preStop:
              httpGet:
                path: /stopListener
                port: http
                scheme: HTTP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:          
          {{- include "datadogApm.environmentVars" . | nindent 10 }}
          - name: "DOCKER_ENV"
            value: {{ .Values.DOCKER_ENV }}
          - name: CONTAINER_PORT
            value: "{{ .Values.CONTAINER_PORT }}"
          - name: CURL_CA_BUNDLE
            value: /truststore/ca-certificates.crt
          - name: JAVA_OPTS
            value: "-Djavax.net.ssl.trustStore=/truststore/custom-cacerts -Djavax.net.ssl.trustStorePassword=changeit"
          # {{ if .Values.natsHubUrl }}
          # - name: "OPSERA_NATS_SERVICE_URL"
          #   value: {{ .Values.natsHubUrl }}
          # {{ end }}
          {{- include "ms.extraSecretEnvironmentVars" .Values | nindent 10 }}
          volumeMounts:
          {{- include "datadogApm.volumeMounts" . | nindent 10 }}
          - name: microservices-efs
            mountPath: /apps/OpsERA/logs/components/
      volumes:
        {{- include "datadogApm.volumes" . | nindent 8 }}
        - name: microservices-efs
          persistentVolumeClaim:
            claimName: microservices-efs
        - name: certs-volume
          configMap:
            name: onprem-certs-config
        - name: truststore-volume
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
