resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 400
  targetMemoryUtilizationPercentage: 120

ingress:
  hosts:
    - host: vnext.opsera-test.opsera.io
      paths:
        - path: /vnext
          pathType: ImplementationSpecific

NODE_ENV: testing
