resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 400
  targetMemoryUtilizationPercentage: 160

ingress:
  hosts:
    - host: dev.opsera.io
      paths:
        - path: /nx01
          pathType: ImplementationSpecific

NODE_ENV: testing