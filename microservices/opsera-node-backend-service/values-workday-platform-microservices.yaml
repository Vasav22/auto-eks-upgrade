ingress:
  hosts:
    - host: app.workday.opsera.io
      paths: [/]

resources:
  limits:
    cpu: 3300m
    memory: 4800Mi
  requests:
    cpu: 3300m
    memory: 4800Mi

autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
