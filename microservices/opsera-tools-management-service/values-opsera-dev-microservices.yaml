resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 400
  targetMemoryUtilizationPercentage: 160

ingress:
  hosts:
    - host: tools-management-service.opsera-dev-private.opsera.io
      paths: [/]
