resources:
  limits:
    cpu: 3500m
    memory: 14Gi
  requests:
    cpu: 3500m
    memory: 14Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 60

ingress:
  hosts:
    - host: audit-logs-service.honeywell-private.opsera.io
      paths: [/]
