resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 500Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 300
  targetMemoryUtilizationPercentage: 120

ingress:
  enabled: true
  hosts:
    - host: node-audit-logs-service.opsera-test-private.opsera.io
      paths:
        - path: /
          pathType: ImplementationSpecific

NODE_ENV: testing
