resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 1Gi

#enable ingress for DEV work only, this should not be done for TEST or other platform tiers
ingress:
  enabled: true
  hosts:
    - host: pipeline-settings-operations-service.opsera-dev-private.opsera.io
      paths:
        - path: /
          pathType: ImplementationSpecific

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 400
  targetMemoryUtilizationPercentage: 160
