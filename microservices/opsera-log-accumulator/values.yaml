# Default values for opsera-log-accumulator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 440953937617.dkr.ecr.us-east-2.amazonaws.com/opsera-log-accumulator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8069

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 1Gi

nodeSelector:
  Name: microservice-node

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 300
  targetMemoryUtilizationPercentage: 120

tolerations: []

affinity: {}


extraSecretEnvironmentVars:
  - secretName: microservices-ms-env
    envName: OPSERA_MONGODB_USERNAME
    secretKey: OPSERA_MONGODB_USERNAME
  - secretName: microservices-ms-env
    envName: OPSERA_MONGODB_PASSWORD
    secretKey: OPSERA_MONGODB_PASSWORD
  - secretName: microservices-ms-env
    envName: OPSERA_MONGODB_HOST
    secretKey: OPSERA_MONGODB_HOST
  - secretName: microservices-ms-env
    envName: OPSERA_MONGODB_PORT
    secretKey: OPSERA_MONGODB_PORT
  - secretName: microservices-ms-env
    envName: OPSERA_MONGODB_DATABASE
    secretKey: OPSERA_MONGODB_DATABASE
  - secretName: microservices-ms-env
    envName: OPSERA_HAZELCAST_K8_SERVICE_DNS
    secretKey: OPSERA_HAZELCAST_K8_SERVICE_DNS
  - secretName: microservices-ms-env
    envName: OPSERA_API_SERVICE_URL
    secretKey: OPSERA_API_SERVICE_URL
  - secretName: microservices-ms-env
    envName: OPSERA_KAFKA_BOOTSTRAP_URL
    secretKey: OPSERA_KAFKA_BOOTSTRAP_URL