global:
  # Replace with your New Relic license key
  # licenseKey: ""
  # cluster: "dev-dataplane"
  lowDataMode: true

newrelic-infrastructure:
  enabled: false 

newrelic-prometheus-agent:
  enabled: false

nri-metadata-injection:
  enabled: false

nri-kube-events:
  enabled: true

newrelic-logging:
  enabled: true
  resources: []
  fluentBit: 
    k8sBufferSize: "512k"

  config:
    filters: |
      [FILTER]
          Name                kubernetes
          Alias               kubernetes-enricher
          Match               kube.*
          Use_Tag_For_Meta    On

kube-state-metrics:
  enabled: false


