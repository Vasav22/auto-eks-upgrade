apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.awsIamUser }}-cluster-admin-binding
  labels:
    {{- include "eks-aws-auth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: User
  name: {{ .Values.awsIamUser }}
  apiGroup: "rbac.authorization.k8s.io"
