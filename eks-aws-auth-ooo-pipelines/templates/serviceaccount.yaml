{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eks-aws-auth.serviceAccountName" . }}
  labels:
    {{- include "eks-aws-auth.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "eks-aws-auth.serviceAccountName" . }}
  labels:
    {{- include "eks-aws-auth.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "eks-aws-auth.serviceAccountName" . }}
  labels:
    {{- include "eks-aws-auth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "eks-aws-auth.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eks-aws-auth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
